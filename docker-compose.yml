version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smytheiq
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  backend:
    build: .
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/smytheiq
      - JWT_SECRET=devsecret
      - STRIPE_SECRET_KEY=sk_test_xxx
      - OPENAI_API_KEY=sk_test_xxx
    depends_on:
      - db
    ports:
      - "4000:4000"
volumes:
  db_data:
